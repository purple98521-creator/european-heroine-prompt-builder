const sectionsEl = document.getElementById('sections');

function isSelected(sec, id){
  if(sec.type==='multi') return state[sec.key].has(id);
  return state[sec.key]===id;
}
function toggle(sec, id){
  if(sec.type==='multi'){
    const s = state[sec.key];
    if(s.has(id)) s.delete(id); else s.add(id);
  } else {
    state[sec.key] = id;
    if(sec.key==='heroine') applyHeroineDefaults(HEROINES.find(h=>h.id===id));
  }
  render();
}
function randomizeSection(sec){
  const opts = sec.data();
  if(!opts.length) return;
  if(sec.type==='multi'){
    const n = Math.min(opts.length, 1+Math.floor(Math.random()*2));
    const shuffled = [...opts].sort(()=>Math.random()-0.5).slice(0,n);
    state[sec.key] = new Set(shuffled.map(o=>o.id));
  } else {
    const picked = opts[Math.floor(Math.random()*opts.length)].id;
    state[sec.key] = picked;
    if(sec.key==='heroine') applyHeroineDefaults(HEROINES.find(h=>h.id===picked));
  }
  render();
}

/* ---------- プロンプト組み立て ---------- */

function findPrompt(list, id){
  const o = list.find(x=>x.id===id);
  return o ? o.prompt : '';
}
function joinPrompts(list, ids, prefix){
  const parts = [...ids].map(id=>findPrompt(list,id)).filter(Boolean);
  if(!parts.length) return '';
  return (prefix||'') + parts.join(', ');
}

function buildPromptFor(h, overrides){
  const s = Object.assign({}, state, overrides||{});
  const parts = [];
  parts.push(h.base);
  const costumePrompt = findPrompt(COSTUMES, s.costume);
  if(costumePrompt) parts.push('wearing '+costumePrompt);
  const palettePrompt = findPrompt(PALETTES, s.palette);
  if(palettePrompt) parts.push('in '+palettePrompt);
  const patternsPrompt = joinPrompts(PATTERNS, s.patterns, '');
  if(patternsPrompt) parts.push('decorated with '+patternsPrompt);
  const scenePrompt = findPrompt(SCENES, s.scene);
  if(scenePrompt) parts.push(scenePrompt);
  const stylePrompt = findPrompt(STYLES, s.style);
  if(stylePrompt) parts.push(stylePrompt);
  const deformPrompt = findPrompt(DEFORM, s.deform);
  if(deformPrompt) parts.push(deformPrompt);
  const tonePrompt = findPrompt(TONE, s.tone);
  if(tonePrompt) parts.push(tonePrompt);
  const dynPrompt = findPrompt(DYN, s.dyn);
  if(dynPrompt) parts.push(dynPrompt);
  const framingPrompt = findPrompt(FRAMING, s.framing);
  if(framingPrompt) parts.push(framingPrompt);
  const anglePrompt = findPrompt(ANGLE, s.angle);
  if(anglePrompt) parts.push(anglePrompt);
  const handsPrompt = findPrompt(HANDS, s.hands);
  if(handsPrompt) parts.push(handsPrompt);
  const exprPrompt = findPrompt(EXPR, s.expression);
  if(exprPrompt) parts.push(exprPrompt);
  if(s.exprExtra) parts.push(s.exprExtra);
  const faceRefPrompt = findPrompt(FACE_REF, s.faceRef);
  if(faceRefPrompt) parts.push(faceRefPrompt);
  const makeupPrompt = findPrompt(MAKEUP, s.makeup);
  if(makeupPrompt) parts.push(makeupPrompt);
  const featuresPrompt = joinPrompts(FEATURES, s.features, '');
  if(featuresPrompt) parts.push(featuresPrompt);
  const motifsPrompt = joinPrompts(MOTIFS, s.motifs, '');
  if(motifsPrompt) parts.push('with '+motifsPrompt);
  const propsPrompt = joinPrompts(PROPS, s.props, '');
  if(propsPrompt) parts.push('accompanied by '+propsPrompt);
  const boldPrompt = findPrompt(BOLD, s.bold);
  if(boldPrompt) parts.push(boldPrompt);
  const decorPrompt = joinPrompts(DECOR, s.decor, '');
  if(decorPrompt) parts.push(decorPrompt);
  const lightPrompt = findPrompt(LIGHT, s.light);
  if(lightPrompt) parts.push(lightPrompt);
  if(s.catchphrase){
    const txStyle = findPrompt(TEXTSTYLE, s.textStyle);
    parts.push(`the words "${s.catchphrase}"`+(txStyle?' '+txStyle:'')+' placed within the composition');
  }
  if(s.subtext){
    parts.push(`with the line "${s.subtext}"`);
  }
  const sizePrompt = findPrompt(SIZES, s.size);
  if(sizePrompt) parts.push(sizePrompt);
  if(s.rawExtra) parts.push(s.rawExtra);
  const headroom = "TOP PRIORITY: Do not frame the subject as a tight, face-filling close-up. Compose the shot slightly zoomed out so the head (including the hairline, loose strands, and any flyaway hair) occupies no more than about 40% of the total frame height. The top of the head or hair must never touch, extend beyond, or be cropped by the top edge of the frame. If the costume, background, or other described elements cannot all fit within the frame, crop into the lower body rather than the head.";
  return headroom + ' ' + parts.filter(Boolean).join(', ') + '.';
}

function updatePrompt(){
  const text = buildPromptFor(currentHeroine());
  const out = document.getElementById('promptOut');
  out.value = text;
  document.getElementById('charCount').textContent = text.length + ' 文字';
}

function render(){
  renderSections();
  updatePrompt();
}

document.getElementById('btnCopy').onclick=()=>{
  const out = document.getElementById('promptOut');
  navigator.clipboard.writeText(out.value).then(()=>{
    const btn = document.getElementById('btnCopy');
    const orig = btn.textContent;
    btn.textContent='コピーしました';
    setTimeout(()=>btn.textContent=orig, 1500);
  });
};

document.getElementById('btnBatch').onclick=()=>{
  const lines = HEROINES.map(h=>{
    const validPatternIds = [...state.patterns].filter(id=>{
      const p = PATTERNS.find(x=>x.id===id);
      return p && (!p.group || p.group==='both' || p.group===h.group);
    });
    const overrides = {
      costume:h.defCostume, palette:h.defPalette, expression:h.defExpr,
      motifs:new Set(h.defMotifs), patterns:new Set(validPatternIds),
      props:state.props,
    };
    return `【${h.label}】\n` + buildPromptFor(h, overrides);
  });
  const out = document.getElementById('promptOut');
  out.value = lines.join('\n\n');
  document.getElementById('charCount').textContent = out.value.length + ' 文字';
};

/* ---------- 初期化 ---------- */

applyHeroineDefaults(currentHeroine());
render();
</script>
</body>
