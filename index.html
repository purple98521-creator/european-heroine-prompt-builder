<html lang="ja">

<meta charset="UTF-8">

<title>ヨーロッパの女帝と王妃たち ヒロインプロンプトビルダー</title>
<style>
  :root{

    --magenta:#c2185b;
    --magenta-deep:#94103f;
    --rose:#e07ba0;
    --line:#f3d9e4;
    --chip:#fdf3f7;
    --chip-active:#c2185b;
    --chip-active-ink:#fff5f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--body-font);
    background:var(--bg);
    color:var(--ink);
    line-height:1.7;
  }
  header{
    padding:28px 20px 18px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fff8ec,var(--bg));
  }
  header h1{
    margin:0 0 6px;
    font-family:var(--title-font);
    font-size:1.6rem;
    letter-spacing:.04em;
    color:var(--magenta-deep);
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:.85rem;
  }
  .wrap{max-width:880px;margin:0 auto;padding:20px 16px 40px;}
  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:22px;
  }
  section.card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:16px;
    box-shadow:0 1px 3px rgba(148,16,63,.05);
  }
  section.card h2{
    margin:0 0 4px;
    font-family:var(--title-font);
    font-size:1.08rem;
    color:var(--magenta-deep);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  section.card .desc{
    color:var(--sub);
    font-size:.82rem;
    margin:2px 0 10px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1px solid var(--gold);
    background:var(--chip);
    color:var(--ink);
    border-radius:999px;
    padding:6px 13px;
    font-size:.82rem;
    cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
    line-height:1.3;
  }
  .chip:hover{background:#f7e0ea;border-color:var(--magenta);}
  .chip.active{background:var(--chip-active);color:var(--chip-active-ink);border-color:var(--chip-active);}
  .chip.star::after{content:" ★";color:var(--gold-deep);}
  .chip.active.star::after{color:#ffe3ba;}
  .mini-random{
    border:none;background:none;color:var(--sub);
    font-size:.72rem;cursor:pointer;text-decoration:underline;
    white-space:nowrap;
  }
  .mini-random:hover{color:var(--magenta-deep);}
  input[type=text]{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    font-size:.85rem;font-family:inherit;background:#fffdfb;
  }
  .field{margin-top:8px;}
  .field label{font-size:.78rem;color:var(--sub);display:block;margin-bottom:3px;}
  button.big{
    border:1px solid var(--magenta);
    background:var(--magenta);
    color:#fff5f8;
    padding:9px 18px;
    border-radius:999px;
    font-size:.85rem;
    cursor:pointer;
  }
  button.big.ghost{
    background:transparent;color:var(--gold-deep);border-color:var(--gold);
  }
  button.big:hover{opacity:.85;}
  section.output{
    background:linear-gradient(180deg,#fff8ec,var(--panel));
    border:2px solid var(--gold);border-radius:10px;
    padding:16px 18px;margin-bottom:16px;
  }
  section.output h2{margin:0 0 4px;font-family:var(--title-font);font-size:1.08rem;color:var(--magenta-deep);}
  textarea#promptOut{
    width:100%;min-height:140px;resize:vertical;
    border:1px solid var(--line);border-radius:6px;padding:8px;
    font-size:.85rem;font-family:inherit;background:#fff;
  }
  .out-controls{display:flex;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap;gap:8px;}
  .charcount{font-size:.75rem;color:var(--sub);}
  .out-buttons{display:flex;gap:8px;flex-wrap:wrap;}
  .out-buttons button{
    border:1px solid var(--gold-deep);background:#fff;color:var(--gold-deep);
    padding:6px 12px;border-radius:999px;font-size:.78rem;cursor:pointer;
  }
  .out-buttons button.primary{background:var(--magenta);border-color:var(--magenta);color:#fff5f8;}
</style>
</head>
<body>
<header>
  <h1>ヨーロッパの女帝と王妃たち ヒロインプロンプトビルダー</h1>
  <p>マリー・アントワネット、マリア・テレジア、エカチェリーナ2世、ジョゼフィーヌ、エリザベート（シシィ）を対象にした、AI画像生成用プロンプトの組み立てツールです。（18〜19世紀ヨーロッパ編／全13人シリーズより5人）</p>
</header>

<div class="wrap">
  <div class="toolbar">
    <button class="big" id="btnRecommend">◎ おすすめの設定にまとめて合わせる</button>
    <button class="big ghost" id="btnRandomAll">全項目をおまかせで選ぶ</button>
    <button class="big ghost" id="btnResetAll">選び直す</button>
  </div>

  <p class="desc" style="text-align:center;margin-top:0;">画風・デフォルメ・色調・躍動感・参照画像・アングル・手の扱い・装飾・光・文字は保たれます。ヒロインを選び直すと、装束・色目・モチーフ・表情だけが初期値に入れ替わります。（5人 × 3場面 = 全15パターン）</p>

  <div id="sections"></div>

  <section class="output">
    <h2>組み上がったプロンプト</h2>
    <textarea id="promptOut" readonly></textarea>
    <div class="out-controls">
      <span class="charcount" id="charCount">0 文字</span>
      <div class="out-buttons">
        <button id="btnCopy" class="primary">コピーする</button>
        <button id="btnBatch">15人分をまとめて書き出す</button>
      </div>
    </div>
  </section>
</div>

const sectionsEl = document.getElementById('sections');

function isSelected(sec, id){
  if(sec.type==='multi') return state[sec.key].has(id);
  return state[sec.key]===id;
}
function toggle(sec, id){
  if(sec.type==='multi'){
    const s = state[sec.key];
    if(s.has(id)) s.delete(id); else s.add(id);
  } else {
    state[sec.key] = id;
    if(sec.key==='heroine') applyHeroineDefaults(HEROINES.find(h=>h.id===id));
  }
  render();
}
function randomizeSection(sec){
  const opts = sec.data();
  if(!opts.length) return;
  if(sec.type==='multi'){
    const n = Math.min(opts.length, 1+Math.floor(Math.random()*2));
    const shuffled = [...opts].sort(()=>Math.random()-0.5).slice(0,n);
    state[sec.key] = new Set(shuffled.map(o=>o.id));
  } else {
    const picked = opts[Math.floor(Math.random()*opts.length)].id;
    state[sec.key] = picked;
    if(sec.key==='heroine') applyHeroineDefaults(HEROINES.find(h=>h.id===picked));
  }
  render();
}

/* ---------- プロンプト組み立て ---------- */

function findPrompt(list, id){
  const o = list.find(x=>x.id===id);
  return o ? o.prompt : '';
}
function joinPrompts(list, ids, prefix){
  const parts = [...ids].map(id=>findPrompt(list,id)).filter(Boolean);
  if(!parts.length) return '';
  return (prefix||'') + parts.join(', ');
}

function buildPromptFor(h, overrides){
  const s = Object.assign({}, state, overrides||{});
  const parts = [];
  parts.push(h.base);
  const costumePrompt = findPrompt(COSTUMES, s.costume);
  if(costumePrompt) parts.push('wearing '+costumePrompt);
  const palettePrompt = findPrompt(PALETTES, s.palette);
  if(palettePrompt) parts.push('in '+palettePrompt);
  const patternsPrompt = joinPrompts(PATTERNS, s.patterns, '');
  if(patternsPrompt) parts.push('decorated with '+patternsPrompt);
  const scenePrompt = findPrompt(SCENES, s.scene);
  if(scenePrompt) parts.push(scenePrompt);
  const stylePrompt = findPrompt(STYLES, s.style);
  if(stylePrompt) parts.push(stylePrompt);
  const deformPrompt = findPrompt(DEFORM, s.deform);
  if(deformPrompt) parts.push(deformPrompt);
  const tonePrompt = findPrompt(TONE, s.tone);
  if(tonePrompt) parts.push(tonePrompt);
  const dynPrompt = findPrompt(DYN, s.dyn);
  if(dynPrompt) parts.push(dynPrompt);
  const framingPrompt = findPrompt(FRAMING, s.framing);
  if(framingPrompt) parts.push(framingPrompt);
  const anglePrompt = findPrompt(ANGLE, s.angle);
  if(anglePrompt) parts.push(anglePrompt);
  const handsPrompt = findPrompt(HANDS, s.hands);
  if(handsPrompt) parts.push(handsPrompt);
  const exprPrompt = findPrompt(EXPR, s.expression);
  if(exprPrompt) parts.push(exprPrompt);
  if(s.exprExtra) parts.push(s.exprExtra);
  const faceRefPrompt = findPrompt(FACE_REF, s.faceRef);
  if(faceRefPrompt) parts.push(faceRefPrompt);
  const makeupPrompt = findPrompt(MAKEUP, s.makeup);
  if(makeupPrompt) parts.push(makeupPrompt);
  const featuresPrompt = joinPrompts(FEATURES, s.features, '');
  if(featuresPrompt) parts.push(featuresPrompt);
  const motifsPrompt = joinPrompts(MOTIFS, s.motifs, '');
  if(motifsPrompt) parts.push('with '+motifsPrompt);
  const propsPrompt = joinPrompts(PROPS, s.props, '');
  if(propsPrompt) parts.push('accompanied by '+propsPrompt);
  const boldPrompt = findPrompt(BOLD, s.bold);
  if(boldPrompt) parts.push(boldPrompt);
  const decorPrompt = joinPrompts(DECOR, s.decor, '');
  if(decorPrompt) parts.push(decorPrompt);
  const lightPrompt = findPrompt(LIGHT, s.light);
  if(lightPrompt) parts.push(lightPrompt);
  if(s.catchphrase){
    const txStyle = findPrompt(TEXTSTYLE, s.textStyle);
    parts.push(`the words "${s.catchphrase}"`+(txStyle?' '+txStyle:'')+' placed within the composition');
  }
  if(s.subtext){
    parts.push(`with the line "${s.subtext}"`);
  }
  const sizePrompt = findPrompt(SIZES, s.size);
  if(sizePrompt) parts.push(sizePrompt);
  if(s.rawExtra) parts.push(s.rawExtra);
  return parts.filter(Boolean).join(', ') + '.';
}

function updatePrompt(){
  const text = buildPromptFor(currentHeroine());
  const out = document.getElementById('promptOut');
  out.value = text;
  document.getElementById('charCount').textContent = text.length + ' 文字';
}

function render(){
  renderSections();
  updatePrompt();
}

document.getElementById('btnCopy').onclick=()=>{
  const out = document.getElementById('promptOut');
  navigator.clipboard.writeText(out.value).then(()=>{
    const btn = document.getElementById('btnCopy');
    const orig = btn.textContent;
    btn.textContent='コピーしました';
    setTimeout(()=>btn.textContent=orig, 1500);
  });
};

document.getElementById('btnBatch').onclick=()=>{
  const lines = HEROINES.map(h=>{
    const validPatternIds = [...state.patterns].filter(id=>{
      const p = PATTERNS.find(x=>x.id===id);
      return p && (!p.group || p.group==='both' || p.group===h.group);
    });
    const overrides = {
      costume:h.defCostume, palette:h.defPalette, expression:h.defExpr,
      motifs:new Set(h.defMotifs), patterns:new Set(validPatternIds),
      props:state.props,
    };
    return `【${h.label}】\n` + buildPromptFor(h, overrides);
  });
  const out = document.getElementById('promptOut');
  out.value = lines.join('\n\n');
  document.getElementById('charCount').textContent = out.value.length + ' 文字';
};

/* ---------- 初期化 ---------- */

applyHeroineDefaults(currentHeroine());
render();
</script>
</body>
